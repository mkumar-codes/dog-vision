# Netlify builds the frontend from source (it does not run Docker).
# Set VITE_API_URL to your deployed backend URL in:
# Netlify → Site configuration → Environment variables
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
